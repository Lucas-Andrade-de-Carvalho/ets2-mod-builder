name: Compilar Gerador Windows

on:
  push:
    paths:
      - "gerador_windows/**"
      - ".github/workflows/gerador-windows.yml"
  pull_request:
    paths:
      - "gerador_windows/**"
      - ".github/workflows/gerador-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe e executar testes de regressao
        shell: pwsh
        run: |
          python -m py_compile gerador_windows/gerador.py
          python -m unittest discover -s gerador_windows -p "test_*.py" -v
      - name: Instalar PyInstaller
        run: python -m pip install pyinstaller==6.16.0
      - name: Gerar EXE de interface grafica
        run: python -m PyInstaller --onefile --windowed --name ETS2_Company_Gerador --distpath dist gerador_windows/gerador.py
      - name: Gerar alternativa Windows em pasta (sem --onefile)
        shell: pwsh
        run: python -m PyInstaller --onedir --windowed --name ETS2_Company_Gerador --distpath dist_portable --workpath build_portable --specpath specs_portable gerador_windows/gerador.py
      - name: Executar EXE real com tres mapas sinteticos
        shell: pwsh
        run: |
          python gerador_windows/smoke_exe.py dist/ETS2_Company_Gerador.exe
          python gerador_windows/smoke_exe.py dist_portable/ETS2_Company_Gerador/ETS2_Company_Gerador.exe
      - name: Conferir arquivo Windows
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ETS2_Company_Gerador.exe")) { throw "EXE nao gerado" }
          if ((Get-Item "dist/ETS2_Company_Gerador.exe").Length -lt 2000000) { throw "EXE incompleto" }
          if (-not (Test-Path "dist_portable/ETS2_Company_Gerador/ETS2_Company_Gerador.exe")) { throw "EXE em pasta nao gerado" }
          if (-not (Test-Path "dist_portable/ETS2_Company_Gerador/_internal")) { throw "Dependencias do EXE em pasta ausentes" }
      - name: Preparar pacote de entrega com instrucoes e hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/ETS2_Company_Gerador.exe release/ETS2_Company_Gerador.exe
          Copy-Item gerador_windows/GUIA_VERSAO_FINAL_CANDIDATA_20261022.md release/GUIA_DE_UTILIZACAO.md
          Copy-Item gerador_windows/GUIA_ELDORADO_SEMANTICA_INGLESA.md release/GUIA_ELDORADO_SEMANTICA_INGLESA.md
          Copy-Item gerador_windows/VALIDACAO_FINAL_RBR_20261022.md release/VALIDACAO_FINAL_RBR.md
          Copy-Item gerador_windows/DIAGNOSTICO_RBR_RELATORIOS_5.md release/DIAGNOSTICO_RBR_AUDITORIA_5.md
          Copy-Item gerador_windows/GUIA_CONSOLIDACAO_TRES_MAPAS.md release/GUIA_CONSOLIDACAO_TRES_MAPAS.md
          Copy-Item gerador_windows/GUIA_CHECKLIST_FINAL_SEM_REGRESSOES.md release/CHECKLIST_FINAL_SEM_REGRESSOES.md
          Copy-Item gerador_windows/GUIA_FECHAMENTO_QUALIDADE_V3.md release/LEIA_PRIMEIRO_QUALIDADE_FINAL_V3.md
          Copy-Item gerador_windows/DIAGNOSTICO_CONSOLIDADO_MG_ELDORADO_RBR_20261022.md release/DIAGNOSTICO_REAL_TRES_MAPAS_22OUT2026.md
          Copy-Item gerador_windows/GUIA_ADAPTACAO_PLUMA_COCO_20261022.md release/GUIA_PLUMA_COCO_MG_ELDORADO.md
          Copy-Item gerador_windows/CORRECAO_LACUNAS_RELATORIOS_4_20261022.md release/LACUNAS_MG_ELDORADO_RBR.md
          $sha=(Get-FileHash release/ETS2_Company_Gerador.exe -Algorithm SHA256).Hash.ToLower()
          "COMMIT=$env:GITHUB_SHA" | Out-File release/PROVENIENCIA_SHA256.txt -Encoding utf8
          "SHA256_EXE=$sha" | Out-File release/PROVENIENCIA_SHA256.txt -Append -Encoding utf8
          "HOMOLOGACAO_ETS2=PENDENTE_DE_TESTES_REAIS" | Out-File release/PROVENIENCIA_SHA256.txt -Append -Encoding utf8
      - name: Disponibilizar pacote Windows no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Gerador-ETS2-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Preparar alternativas de download verificaveis
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release_portable -Force | Out-Null
          Copy-Item dist_portable/ETS2_Company_Gerador -Destination release_portable -Recurse -Force
          Copy-Item gerador_windows/GUIA_ALTERNATIVAS_DOWNLOAD_SEGURO.md release_portable/LEIA_PRIMEIRO.md
          Copy-Item gerador_windows/GUIA_ELDORADO_SEMANTICA_INGLESA.md release_portable/GUIA_ELDORADO_SEMANTICA_INGLESA.md
          $exe = "release_portable/ETS2_Company_Gerador/ETS2_Company_Gerador.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "COMMIT=$env:GITHUB_SHA" | Out-File release_portable/PROVENIENCIA_PASTA_SHA256.txt -Encoding utf8
          "SHA256_EXE_PASTA=$sha" | Out-File release_portable/PROVENIENCIA_PASTA_SHA256.txt -Append -Encoding utf8
          "SEGURANCA_NAO_GARANTIDA_VERIFICAR_ANTIVIRUS=true" | Out-File release_portable/PROVENIENCIA_PASTA_SHA256.txt -Append -Encoding utf8
          New-Item -ItemType Directory -Path release_source -Force | Out-Null
          Copy-Item gerador_windows/*.py release_source/ -Force
          Copy-Item gerador_windows/GUIA_ALTERNATIVAS_DOWNLOAD_SEGURO.md release_source/LEIA_PRIMEIRO.md
          Copy-Item gerador_windows/GUIA_ELDORADO_SEMANTICA_INGLESA.md release_source/GUIA_ELDORADO_SEMANTICA_INGLESA.md
          "COMMIT=$env:GITHUB_SHA" | Out-File release_source/PROVENIENCIA_CODIGO_FONTE.txt -Encoding utf8
          "VERSAO=Python_3.12_sem_EXE" | Out-File release_source/PROVENIENCIA_CODIGO_FONTE.txt -Append -Encoding utf8
          if (-not (Test-Path "release_source/gerador.py")) { throw "Codigo-fonte nao empacotado" }
      - name: Disponibilizar alternativa Windows em pasta
        uses: actions/upload-artifact@v4
        with:
          name: Gerador-ETS2-Windows-Pasta
          path: release_portable/*
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar codigo-fonte sem EXE
        uses: actions/upload-artifact@v4
        with:
          name: Gerador-ETS2-Codigo-Fonte
          path: release_source/*
          if-no-files-found: error
          retention-days: 30
